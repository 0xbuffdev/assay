name: Stage npm package

on:
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: Successful main quality run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: assay-npm-stage
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == '0xbuffdev/assay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-stage
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Verify approval and quality run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.quality_run_id }}
          APPROVED_RUN_ID: ${{ vars.ASSAY_STAGE_RUN_ID }}
          APPROVED_SHA: ${{ vars.ASSAY_STAGE_COMMIT }}
          APPROVED_DIGEST: ${{ vars.ASSAY_STAGE_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVED_RUN_ID" == "$RUN_ID" ]]
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ && "$APPROVED_SHA" == "$GITHUB_SHA" ]]
          [[ "$APPROVED_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$GITHUB_SHA" ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_branch == "main" and
            .head_repository.full_name == $repo and .repository.full_name == $repo and
            .path == ".github/workflows/ci.yml" and .event == "push" and
            .status == "completed" and .conclusion == "success"
          ' <<< "$run_json" >/dev/null
          attempt="$(jq -er '.run_attempt' <<< "$run_json")"
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]]
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "assay-verified-$GITHUB_SHA-$attempt" \
            --dir "$RUNNER_TEMP/assay-release"
          cd "$RUNNER_TEMP/assay-release"
          [[ -f assay.tgz && ! -L assay.tgz && -f manifest.json && ! -L manifest.json ]]
          [[ "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq 2 ]]
          [[ "$(sha256sum assay.tgz | cut -d ' ' -f 1)" == "$APPROVED_DIGEST" ]]
          jq -e --arg digest "$APPROVED_DIGEST" --argjson size "$(wc -c < assay.tgz)" '
            .name == "@0xbuff/assay" and .version == "0.0.1" and
            .sha256 == $digest and .bytes == $size and
            ([.files[].path] | sort) == [
              "CHANGELOG.md", "COPYRIGHT.md", "LICENSE", "README.md",
              "dist/index.d.ts", "dist/index.js", "dist/index.js.map", "package.json"
            ]
          ' manifest.json >/dev/null
          tar -xOzf assay.tgz package/package.json | jq -e '
            .name == "@0xbuff/assay" and .version == "0.0.1" and
            .private == false and .publishConfig.access == "public" and
            .publishConfig.registry == "https://registry.npmjs.org/"
          ' >/dev/null
          tar -xOzf assay.tgz package/CHANGELOG.md > "$RUNNER_TEMP/assay-release-notes.md"
          grep -Eq '^## \[0\.0\.1\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' "$RUNNER_TEMP/assay-release-notes.md"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.3
          package-manager-cache: false

      - name: Stage exact approved archive
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_DIGEST: ${{ vars.ASSAY_STAGE_SHA256 }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        working-directory: ${{ runner.temp }}/assay-release
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$GITHUB_SHA" ]]
          [[ "$(sha256sum assay.tgz | cut -d ' ' -f 1)" == "$APPROVED_DIGEST" ]]
          unset NODE_AUTH_TOKEN NPM_TOKEN
          node --version
          npm --version
          npm stage publish ./assay.tgz --access public --tag latest --ignore-scripts --registry https://registry.npmjs.org/
