name: Assay quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: assay-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Foundation, types, lint, tests and packed consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Check out proposed source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exactly locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Validate repository foundation
        run: pnpm check:foundation
      - name: Typecheck
        run: pnpm typecheck
      - name: Check Biome formatting and lint
        run: pnpm check:style
      - name: Unit tests
        run: pnpm test
      - name: Build and verify emitted package entry
        run: pnpm build
      - name: Independently verify exact packed package and security boundaries
        run: pnpm verify:package

  # Quality-only CI: no npm publish, deploy or write credentials.
