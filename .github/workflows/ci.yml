name: Assay quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: assay-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Foundation, types, lint, tests and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out proposed source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Bootstrap lockfile once. Subsequent commit must switch to --frozen-lockfile.
      - name: Bootstrap dependency lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Print dependency lockfile for review
        run: |
          echo 'ASSAY_LOCKFILE_BEGIN'
          cat pnpm-lock.yaml
          echo 'ASSAY_LOCKFILE_END'
      - name: Validate repository foundation
        run: pnpm check:foundation
      - name: Typecheck
        run: pnpm typecheck
      - name: Format and lint (advisory during lockfile bootstrap)
        run: |
          pnpm exec biome check --write .
          git diff -- . ':!pnpm-lock.yaml'
      - name: Unit tests
        run: pnpm test
      - name: Build and verify emitted package entry
        run: pnpm build

  # Quality-only CI. Package publication and license approval are separate gates.
