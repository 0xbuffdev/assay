name: Assay quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: assay-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks and TypeScript import
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install reproducible empty dependency set
        run: pnpm install --frozen-lockfile
      - name: Validate repository foundation
        run: pnpm check
      - name: Test source import
        run: pnpm test

  # Quality-only CI: no deployment, npm publish or write permissions.
